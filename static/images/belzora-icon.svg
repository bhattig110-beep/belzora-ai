<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Master Vibrant Iridescent Gradient: Bela Rose -> Royal Violet -> Cyan Dawn -->
    <linearGradient id="belzoraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a75"/>
      <stop offset="28%" stop-color="#f43f5e"/>
      <stop offset="65%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>

    <!-- Reverse Gradient for Interlocking Loop Depth -->
    <linearGradient id="belzoraGradientAlt" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#ff1a75"/>
    </linearGradient>

    <!-- Subtle Glass Tile Gradient -->
    <linearGradient id="glassBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a75" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Metallic Specular Edge Highlight -->
    <linearGradient id="specularGleam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Ambient Tile Drop Shadow -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.15"/>
    </filter>

    <!-- Emblem Elevation Shadow -->
    <filter id="emblemShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- SQUIRCLE CONTAINER TILE -->
  <rect x="36" y="36" width="440" height="440" rx="116" fill="url(#glassBase)" filter="url(#tileShadow)"/>
  <rect x="36" y="36" width="440" height="440" rx="116" fill="none" stroke="url(#borderRing)" stroke-width="3"/>
  <rect x="42" y="42" width="428" height="428" rx="110" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.85"/>

  <!-- MASTER MONOGRAM "B" (Continuous Mathematical Infinity Prism) -->
  <g filter="url(#emblemShadow)">
    
    <!-- Outer Powerful Solid "B" Silhouette with Perfect Geometry -->
    <path d="M 148 112 
             C 148 98, 160 86, 176 86 
             L 264 86 
             C 334 86, 384 126, 384 192 
             C 384 232, 356 258, 314 266 
             C 368 276, 400 310, 400 360 
             C 400 426, 344 466, 264 466 
             L 176 466 
             C 160 466, 148 454, 148 440 Z
             
             M 218 148 
             L 218 240 
             L 262 240 
             C 298 240, 324 224, 324 194 
             C 324 164, 298 148, 262 148 Z
             
             M 218 302 
             L 218 404 
             L 266 404 
             C 308 404, 338 384, 338 353 
             C 338 322, 308 302, 266 302 Z" 
          fill="url(#belzoraGradient)" 
          fill-rule="evenodd"/>

    <!-- Dynamic Flowing Accent Loop (Bela to Zoraiz Fusion Ribbon) -->
    <path d="M 148 112 
             C 148 98, 160 86, 176 86 
             L 264 86 
             C 334 86, 384 126, 384 192 
             C 384 232, 356 258, 314 266 
             L 218 266 
             L 218 148 
             L 262 148 
             C 298 148, 324 164, 324 194 
             C 324 212, 312 226, 292 234 
             L 218 234 Z" 
          fill="url(#specularGleam)" 
          opacity="0.35"/>

    <!-- Sleek Diagonal Prismatic Core Sparkle -->
    <path d="M 314 266 
             L 348 246 
             L 332 266 
             L 352 284 Z" 
          fill="#ffffff" 
          opacity="0.8"/>
  </g>
</svg>
