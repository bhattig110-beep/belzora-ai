<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="100%">
  <defs>
    <!-- Multi-stop Gradient 1: Bela (Rose, Fuchsia & Electric Purple) -->
    <linearGradient id="belzoraGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e7e"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Multi-stop Gradient 2: Zoraiz (Electric Indigo & Cyan) -->
    <linearGradient id="belzoraGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="75%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Wordmark Luxury Typography Gradient -->
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- AI Jewel Pill Gradient -->
    <linearGradient id="aiPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Star Core Gradient -->
    <linearGradient id="starCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#8b5cf6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 1. ICON MARK CONTAINER (LEFT) -->
  <g transform="translate(18, 18)" filter="url(#logoShadow)">
    <!-- Glass Squircle Backdrop -->
    <rect x="0" y="0" width="144" height="144" rx="40" fill="#ffffff" stroke="url(#belzoraGrad1)" stroke-width="2.5" stroke-opacity="0.4"/>
    <rect x="3" y="3" width="138" height="138" rx="37" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9"/>

    <!-- Dynamic B Spine -->
    <rect x="38" y="28" width="18" height="88" rx="9" fill="url(#belzoraGrad1)"/>

    <!-- Upper Loop (Bela) -->
    <path d="M 48 28 C 80 28, 102 38, 102 60 C 102 75, 88 82, 68 84" fill="none" stroke="url(#belzoraGrad1)" stroke-width="17" stroke-linecap="round"/>

    <!-- Lower Loop (Zoraiz) -->
    <path d="M 50 78 C 86 78, 108 88, 108 106 C 108 124, 82 126, 48 126" fill="none" stroke="url(#belzoraGrad2)" stroke-width="18" stroke-linecap="round"/>

    <!-- Inner Cutouts -->
    <circle cx="72" cy="56" r="10" fill="#ffffff"/>
    <circle cx="76" cy="102" r="12" fill="#ffffff"/>

    <!-- Central Supernova Spark -->
    <g transform="translate(72, 80)">
      <circle cx="0" cy="0" r="10" fill="#fef08a" opacity="0.5"/>
      <path d="M 0 -15 Q 0 0, 15 0 Q 0 0, 0 15 Q 0 0, -15 0 Q 0 0, 0 -15 Z" fill="url(#starCore)"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- 2. TYPOGRAPHY: BELZORA -->
  <text x="188" y="104" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5" fill="url(#logoTextGrad)">
    BELZORA
  </text>

  <!-- 3. AI JEWEL PILL BADGE -->
  <g transform="translate(554, 52)" filter="url(#logoShadow)">
    <rect x="0" y="0" width="92" height="54" rx="20" fill="url(#aiPillGrad)"/>
    <rect x="1.5" y="1.5" width="89" height="51" rx="18.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="46" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="1" fill="#ffffff" text-anchor="middle">
      AI
    </text>
  </g>

  <!-- 4. SUBTITLE / TAGLINE -->
  <text x="192" y="136" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="4.5" fill="#94a3b8">
    PRO CREATIVE SUITE
  </text>
</svg>
